[package]
name = "gitrs-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
gix = { version = "0.90", default-features = false, features = ["max-performance", "sha1", "basic", "status", "dirwalk", "blame", "merge", "mailmap", "revparse-regex", "worktree-mutation", "interrupt", "notes"] }
regex = "1.13.1"
rmcp = { version = "3.7.0", features = ["server", "transport-io", "macros"] }
percent-encoding = "2.3.2"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
# An in-process MCP client, so tests can drive the server through the real protocol.
rmcp = { version = "3.7.0", features = ["client"] }
