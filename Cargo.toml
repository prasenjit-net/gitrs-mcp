[package]
name = "gitrs-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A local-only Git MCP server built on gitoxide: structured, git-compatible tools, resources and prompts for AI assistants"
license = "MIT OR Apache-2.0"
repository = "https://github.com/prasenjit-net/gitrs-mcp"
homepage = "https://github.com/prasenjit-net/gitrs-mcp"
readme = "README.md"
keywords = ["git", "mcp", "gitoxide", "ai", "llm"]
categories = ["development-tools", "command-line-utilities"]
# Keep the published crate to what builds it; tests, fuzzing and docs stay in the repository.
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE-*"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
gix = { version = "0.90", default-features = false, features = ["max-performance", "sha1", "basic", "status", "dirwalk", "blame", "merge", "mailmap", "revparse-regex", "worktree-mutation", "interrupt", "notes"] }
regex = "1.13.1"
rmcp = { version = "3.7.0", features = ["server", "transport-io", "macros"] }
percent-encoding = "2.3.2"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
# Property tests for everything that parses untrusted input; `fuzz/` goes deeper with libFuzzer.
proptest = "1.12.0"
# An MCP client, so tests can drive the server through the real protocol, in process or as a child.
rmcp = { version = "3.7.0", features = ["client", "transport-child-process"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
